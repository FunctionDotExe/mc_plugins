name: FunctionPlugin
version: '1.5.1'
main: dev.rbm72.functionplugin.FunctionPlugin
api-version: '26.2'
description: TPA suite, homes, and admin quality-of-life commands
author: rbm72
softdepend: [WorldEdit, WeaponsPlugin]

commands:
  tpa:
    description: Request to teleport to another player
    usage: /tpa <player>
  tpahere:
    description: Request another player to teleport to you
    usage: /tpahere <player>
  tpaccept:
    description: Accept a pending teleport request
    usage: /tpaccept
  tpdeny:
    description: Deny a pending teleport request
    usage: /tpdeny
  tpacancel:
    description: Cancel your outgoing teleport request
    usage: /tpacancel
  tpatoggle:
    description: Toggle whether you accept incoming teleport requests
    usage: /tpatoggle
  back:
    description: Return to your previous location (or death spot)
    usage: /back
  functionop:
    description: Grant operator status
    usage: /functionop [player]
    permission: functionplugin.op.grant
  sethome:
    description: Set a home at your current location
    usage: /sethome [name]
  home:
    description: Teleport to a home, or open the home menu
    usage: /home [name]
  delhome:
    description: Delete one of your homes
    usage: /delhome [name]
  homes:
    description: Open the home menu
    usage: /homes
  enderchest:
    description: Open your ender chest and unlock more of its slots
    usage: /enderchest
    aliases: [ec]

permissions:
  functionplugin.op.grant:
    description: Allows granting operator status via /functionop
    default: op
