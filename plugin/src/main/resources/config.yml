# Discord broadcast on boss kills and rare drops. Leave webhook-url blank to
# no-op the whole feature (no secret ships in this file — paste your own).
discord:
  webhook-url: ""
  rare-drop-threshold: 0.05

# Per-fight telemetry. Every finished fight is written to
# plugins/WeaponsPlugin/telemetry/<stamp>-<boss>[-wipe].json, and /bossreport
# prints the recent ones. This is how a mechanic that nobody ever engages with
# becomes visible: a phase whose objective times out on every run shows up as a
# pattern across files, never inside a single fight.
boss-telemetry:
  enabled: true
  # Fights kept in memory for /bossreport (this session only).
  keep-in-memory: 25
  # Newest N files kept on disk; 0 keeps everything forever.
  keep-files: 400

# Boss sound routing. Every boss sound is played under a namespaced key with a
# vanilla fallback (see BossAudio).
boss-audio:
  # ON  = play weaponsplugin:<key>, which only clients that loaded the resource
  #       pack can hear. Turn this on only once the pack ships the keys —
  #       /bosstest all followed by /bossaudio dump generates them.
  # off = play the vanilla fallback sound, i.e. the behaviour before custom
  #       sounds existed. Safe default: a server not pushing the pack would
  #       otherwise go silent in every boss fight.
  custom-sounds: false
  # Two-note rising wind-up on every attack telegraph, roster-wide. Deliberately
  # the same pair for all bosses — it is a language, not flavour.
  telegraph-cues: true

# Stackable difficulty affixes (/bossaffix). Which affixes are armed on which
# boss lives in modifiers.yml; these are the magnitudes each one runs at.
boss-modifiers:
  hard:
    health-multiplier: 1.5
    scale-multiplier: 1.15
    speed-multiplier: 1.2
  frenzy:
    # Extra scalar on every attack cooldown, below the normal phase floor.
    cooldown-multiplier: 0.7
  double-adds:
    copies: 2
  reflect:
    # Share of your damage dealt straight back to you.
    fraction: 0.25
  timer:
    # Minutes before the boss starts escalating on a clock instead of on health.
    minutes: 10.0
    escalation-scale: 1.06
    escalation-speed: 1.05

# Server-wide combat tunables shared by every weapon (see Weapon.java for the
# per-weapon override keys, e.g. weapons.<id>.crit-chance, that fall back to
# these where noted).
combat:
  # Applied to every weapon hit on another player, independently of the PvE
  # numbers those same weapons use against mobs/bosses.
  pvp-damage-multiplier: 0.65

