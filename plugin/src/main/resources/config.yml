# Per-consumable tunables. Charges refill on their own — `recharge-seconds` is
# the real time to regain one spent charge, `use-cooldown-seconds` is the
# minimum gap between two uses no matter how many charges are banked.
consumables:
  lifebloom_vial:
    max-charges: 3
    recharge-seconds: 40.0
    use-cooldown-seconds: 6.0
    heal: 8.0

  emberheart_salve:
    max-charges: 2
    recharge-seconds: 55.0
    use-cooldown-seconds: 8.0
    regen-ticks: 160
    fire-resist-ticks: 200

  warding_poultice:
    max-charges: 2
    recharge-seconds: 70.0
    use-cooldown-seconds: 10.0
    heal: 6.0
    absorption-ticks: 600
    resistance-ticks: 160

  last_light_charm:
    max-charges: 1
    recharge-seconds: 180.0
    use-cooldown-seconds: 30.0
    heal-fraction: 0.5
    regen-ticks: 120

  tidecaller_flask:
    max-charges: 3
    recharge-seconds: 50.0
    use-cooldown-seconds: 6.0
    effect-ticks: 900
    # Shorter than the rest: Dolphin's Grace is the swim-speed one, and it is
    # meant to cover a crossing rather than the whole flooded phase.
    dolphins-grace-ticks: 400

  adrenal_shot:
    max-charges: 2
    recharge-seconds: 75.0
    use-cooldown-seconds: 12.0
    # Paid in health, floored at 1 heart — never lethal on its own.
    health-cost: 4.0
    strength-ticks: 200
    strength-amplifier: 0
    speed-ticks: 200
    haste-ticks: 200

  featherfall_draft:
    max-charges: 4
    recharge-seconds: 30.0
    use-cooldown-seconds: 4.0
    slow-falling-ticks: 300
    jump-ticks: 300

# Per-stone tunables. Every stone reads `stones.<id>.<key>` live, so a movement
# perk retunes without a recompile. Values below are the code defaults.
stones:
  highstep_stone:
    amplifier: 1

  swift_stone:
    amplifier: 1

  tide_stone:
    grace-amplifier: 1

  skyleap_stone:
    # Gap between double jumps. The one-jump-per-airtime rule is the real
    # anti-spam gate; this only stops hopping a leap off every landing.
    cooldown-seconds: 0.9
    boost-up: 0.85
    boost-forward: 0.6

  windrunner_stone:
    max-charges: 2
    recharge-seconds: 4.0
    dash-speed: 1.5
    ground-lift: 0.3
    air-lift: 0.12
    # Only long enough to stop one sneak double-tap firing twice; charges are the gate.
    trigger-lockout-seconds: 0.3

  cliffwalker_stone:
    # Wall-run length per airtime. Refills on landing, never mid-air, which is
    # what stops a wall being a ladder.
    max-stamina-ticks: 40
    wall-check-range: 1.1
    run-speed: 0.34
    catch-kick-up: 0.2
    catch-ticks: 8
    cling-fall-speed: -0.06
    release-kick-out: 0.35
    release-kick-up: 0.15

  levitation_stone:
    cooldown-seconds: 20.0
    levitation-ticks: 100
    slow-falling-ticks: 140

  rimewalk_stone:
    # 1 gives a 3x3 pad under the wielder. Every block is temp terrain and
    # reverts, so a crossing is transport rather than a permanent ice road.
    radius: 1
    lifetime-ticks: 60
    chills-lava: true

  slimebound_stone:
    trigger-fall-speed: -0.55
    look-ahead-blocks: 3
    lifetime-ticks: 40

  pathmaker_stone:
    # Blocks of empty air below before a step counts as a drop worth bridging.
    catch-depth: 4
    lifetime-ticks: 60
    # The pace of the bridge, and this stone's whole balance lever.
    max-blocks-per-second: 6

  gustbound_stone:
    cooldown-seconds: 6.0
    ground-throw-speed: 0.9
    air-throw-speed: 1.2

  riftstep_stone:
    cooldown-seconds: 12.0
    # Vanilla's own hand-thrown pearl is 1.5; higher flies flatter and further.
    throw-speed: 1.8

# Operator items. Deliberately not balanced against the weapon roster — these
# are grants, and `/weaponbalance` never reports on them.
op-items:
  ascendant_elixir:
    duration-ticks: 6000
    # Vanilla's brewing ceiling for the two that have one (Regeneration II,
    # Speed II). Resistance sits at IV: amplifier 4 is full damage immunity,
    # which is a different item and should be asked for on purpose.
    resistance-amplifier: 3
    regeneration-amplifier: 1
    speed-amplifier: 1

  # Endless: applied with INFINITE_DURATION, and drinking again strips the set
  # instead of re-applying (that toggle-off spends no bottle).
  eternal_draught:
    resistance-amplifier: 3
    regeneration-amplifier: 1
    night-vision-amplifier: 0
    saturation-amplifier: 0

  elemental_ward:
    fire-resistance-amplifier: 0
    water-breathing-amplifier: 0
    conduit-power-amplifier: 0
    dolphins-grace-amplifier: 0

  # Timed on purpose: offence is a window you open, not a state you sit in.
  titans_tonic:
    duration-ticks: 4800
    strength-amplifier: 3
    haste-amplifier: 2
    speed-amplifier: 2
    jump-amplifier: 2
    absorption-amplifier: 3

  phantom_draught:
    invisibility-amplifier: 0
    night-vision-amplifier: 0
    speed-amplifier: 1
    slow-falling-amplifier: 0

  prospectors_brew:
    duration-ticks: 12000
    haste-amplifier: 4
    night-vision-amplifier: 0
    speed-amplifier: 1
    luck-amplifier: 2

  second_wind:
    absorption-ticks: 1200
    absorption-amplifier: 3

  bottled_storm:
    bolt-count: 6
    radius: 5
    bolt-interval-ticks: 4

  heart_vessel:
    hearts-per-use: 1

# Bonus hearts, shared by the Heart Vessel and /hearts. The tally on disk is the
# source of truth; the max-health modifier is rebuilt from it on every join.
hearts:
  max-hearts: 20

# Per-boss tunables. Every key under `bosses.<id>` is read live, so `/bossreload`
# retunes a fight already in progress. Values below are the code defaults —
# deleting a key just falls back to the same number.
#
# These framework keys are valid in any boss section too, and are left out below
# because their defaults suit every boss: `meters` (true), `meter-tick-interval` (5),
# `meter-channel` (auto), `meter-bar-stack-limit` (2), `max-ledger-blocks` (120000),
# `restore-blocks-per-tick` (4000), `pit-depth` (6.0), `pit-damage-fraction` (0.55),
# `max-explosion-power` (4.0), `max-crater-radius` (6.0), `max-falling-blocks` (24),
# `max-particles-per-tick` (400), `phase-cooldown-progress-cut` (0.45),
# `phase-cooldown-enrage-cut` (0.85), `phase-cooldown-floor` (0.45),
# `worldguard-protection` (false). Individual meters take overrides at
# `bosses.<id>.meter.<meter>.{heal-cap-per-second,heal-cap-burst-seconds,heal-converted-per-health}`,
# whose defaults come from each meter's own skin.
#
# One caution on `worldguard-protection`: setting it true adds a build-denied region
# over the arena, and most of the roster's objectives are things the group *builds* —
# jamming the Weeping Colossus's walls, scaffolding up the Solar Colossus, pouring
# buckets at the Inferno Warlord, walling off the Necro Overlord's lanes. Denying
# building there leaves those phases with nothing but the floor-lock timeout.
