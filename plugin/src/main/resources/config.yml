# Discord broadcast on boss kills and rare drops. Leave webhook-url blank to
# no-op the whole feature (no secret ships in this file — paste your own).
discord:
  webhook-url: ""
  rare-drop-threshold: 0.05

# Server-wide combat tunables shared by every weapon (see Weapon.java for the
# per-weapon override keys, e.g. weapons.<id>.crit-chance, that fall back to
# these where noted).
combat:
  # Applied to every weapon hit on another player, independently of the PvE
  # numbers those same weapons use against mobs/bosses.
  pvp-damage-multiplier: 0.65

# Per-weapon tunables. Each key under `weapons.<id>` is read by that
